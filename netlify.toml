# Netlify deployment configuration — Koos & Mike Cars CRM (Vite + React SPA)
#
# Site environment variables to set in Netlify
# (Project configuration > Environment variables):
#   VITE_SUPABASE_URL               Supabase project URL
#   VITE_SUPABASE_PUBLISHABLE_KEY   Supabase publishable key (sb_publishable_…)
#
# Both values are public by design: they are shipped to the browser and access
# is enforced by Supabase Row Level Security. Do NOT mark them as
# "Contains secret values" in Netlify — the built site must contain them, so a
# secret flag makes Netlify's secret scanner fail every deploy.
#
# Never put a private value (service role key, API tokens, passwords) in a
# VITE_ variable or anywhere in this repository: everything with a VITE_ prefix
# is inlined into the public JavaScript bundle.
#
# The legacy Supabase anon key is a JWT, and deploy-time scanners flag any JWT
# found in the build output. The app therefore uses the publishable key
# (src/api/supabaseClient.js) and never inlines the anon key.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

  # The client only ships public values (project URL + publishable key), so
  # pattern-based smart detection has nothing genuine to protect here and is
  # turned off. Scanning for environment variables explicitly marked as secret
  # stays enabled, so a private value that reaches the build still fails.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY"

  # Netlify reads the SECRETS_SCAN_* settings from the site's environment
  # variables (Project configuration > Environment variables), not from this
  # file. If a deploy still reports an exposed secret, create these two keys
  # there with the same values.

# Single-page app: every route is rendered client-side by react-router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Hashed build assets never change, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must be revalidated so PWA updates are picked up.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
