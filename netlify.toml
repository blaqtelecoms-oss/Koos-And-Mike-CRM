# Netlify deployment configuration — Koos & Mike Cars CRM (Vite + React SPA)
#
# Site environment variables to set in Netlify
# (Project configuration > Environment variables):
#   VITE_SUPABASE_URL          Supabase project URL
#   VITE_SUPABASE_ANON_KEY     Supabase anon/publishable key (public by design)
#
# Only mark values that must stay private (service role key, API tokens,
# passwords) as "Contains secret values". Never commit them to this repository.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

  # The Supabase anon/publishable key is intentionally shipped to the browser:
  # it is a public key and data access is enforced by Row Level Security.
  # Netlify's smart detection cannot tell that public JWT apart from a leaked
  # secret and fails the deploy, so it is disabled here. Scanning for
  # environment variables marked as secret stays enabled, so a genuinely
  # private value that reaches the build output still fails the deploy.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_PUBLISHABLE_KEY"

# Single-page app: every route is rendered client-side by react-router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Hashed build assets never change, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must be revalidated so PWA updates are picked up.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
